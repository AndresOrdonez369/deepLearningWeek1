<style>
:root{--night:oklch(0.17 0.03 258);--night-2:oklch(0.215 0.035 258);--night-3:oklch(0.26 0.038 258);--line:oklch(0.34 0.035 258);--grid:oklch(0.235 0.03 258);
--ink:oklch(0.97 0.008 250);--ink-2:oklch(0.82 0.03 250);--ink-3:oklch(0.68 0.035 252);--amber:oklch(0.83 0.155 72);--azure:oklch(0.75 0.13 235);--mint:oklch(0.85 0.14 165);
--coral:oklch(0.72 0.17 28);--lilac:oklch(0.78 0.11 300);--ease:cubic-bezier(0.16,1,0.3,1);--sans:"Lexend",system-ui,sans-serif;--display:"Unbounded","Lexend",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--sans)}
a{color:var(--amber)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 22rem;grid-template-rows:auto auto 1fr;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font:700 1.35rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
header .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:.4rem;font:600 .95rem/1 var(--sans);padding:.6rem 1rem;border-radius:999px;border:2px solid var(--line);background:var(--night-2);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--night)}
nav.maps{grid-column:1/-1;padding:.5rem .9rem;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.15rem}
nav.maps button{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;background:none;border:0;border-radius:999px;padding:.5rem .62rem;color:var(--ink-2);font:500 .92rem/1.1 var(--sans);cursor:pointer}
nav.maps button b{font:700 .8rem/1 var(--mono);color:var(--ink-3)}
nav.maps button:hover{background:var(--night-2);color:var(--ink)}
nav.maps button[aria-current=true]{background:var(--night-3);color:var(--ink)}
nav.maps button[aria-current=true] b{color:var(--amber)}
nav.maps button:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
main{padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;min-width:0}
main h2{font:600 1.6rem/1.15 var(--sans);margin:0;letter-spacing:-.01em}
main .sub{color:var(--ink-2);margin:0;font-size:1.05rem}
.plate{background:var(--night-2);border:1px solid oklch(0.3 0.035 258);border-radius:1rem;position:relative;overflow:hidden}
.plate::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
#map{display:block;width:100%;height:auto;position:relative}
.tour{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.tour .pos{font:600 .95rem/1 var(--mono);color:var(--ink-2)}
.legend{display:flex;gap:1.1rem;flex-wrap:wrap;color:var(--ink-3);font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend i{display:inline-block;width:1.6rem;height:.9rem;border-radius:999px;border:2px solid var(--ink-3)}
aside.det{border-left:1px solid var(--line);padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:1rem;overflow:auto}
.det h3{font:600 1.45rem/1.2 var(--sans);margin:0}
.det .empty{color:var(--ink-3);line-height:1.5}
.det dl{margin:0;display:grid;gap:.9rem}
.det dt{font:600 .78rem/1 var(--sans);letter-spacing:.04em;color:var(--ink-3);margin-bottom:.35rem}
.det dd{margin:0;font-size:1.05rem;line-height:1.48;color:var(--ink)}
.det dd.q{color:var(--mint)}
.det dd.t{color:var(--coral)}
.det .meta{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;font:600 .8rem/1 var(--sans);padding:.45rem .75rem;border-radius:999px;background:var(--night-3);color:var(--ink-2);text-decoration:none}
.chip.key{background:var(--amber);color:var(--night)}.chip.trend{background:var(--lilac);color:var(--night)}
a.chip:hover{color:var(--ink)}
/* svg */
.edge{fill:none;stroke:var(--ink-3);stroke-width:3;opacity:.65;transition:opacity .3s,stroke .3s}
.edge.on{stroke:var(--amber);opacity:1;stroke-width:4}
.elab{font:500 20px var(--sans);fill:var(--ink-2);transition:opacity .3s}
.elab-bg{fill:var(--night-2)}
.node{cursor:pointer;transition:opacity .3s}
.node rect{fill:var(--night);stroke:var(--ink-3);stroke-width:3;transition:stroke .2s,fill .2s}
.node text{font:600 26px var(--sans);fill:var(--ink);text-anchor:middle;pointer-events:none}
.node.key rect{stroke:var(--amber);stroke-width:4}
.node.ex rect{stroke-dasharray:8 7;stroke:var(--ink-2)}
.node.tool text{font-family:var(--mono);font-weight:600;font-size:23px}
.node.tool rect{fill:var(--night-3)}
.node.trend rect{stroke:var(--lilac)}
.node.trap rect{stroke:var(--coral)}
.node .badge{fill:var(--amber)}.node .badgen{font:700 19px var(--mono);fill:var(--night)}
.node:hover rect,.node:focus-visible rect{fill:var(--night-3)}
.node:focus{outline:none}.node:focus-visible rect{stroke:var(--ink);stroke-width:5}
.node.sel rect{fill:oklch(0.83 0.155 72 / .14);stroke:var(--amber);stroke-width:5}
svg.dim .node:not(.sel):not(.nb){opacity:.38}
svg.dim .edge:not(.on),svg.dim .elab:not(.on){opacity:.25}

nar", "nb": "NB01 §3–4"}, {"id": "xor", "label": "El límite: XOR", "x": 700, "y": 310, "kind": "key", "key": 3, "say": "Una neurona solo traza una recta, y ninguna recta separa XOR.", "ex": "La luz de la escalera: dos interruptores en posiciones distintas.", "ask": "¿Alguien puede trazar una línea que separe las dos luces encendidas?", "trap": "Pensar que con más épocas el perceptrón terminará aprendiendo XOR.", "slide": "xor", "nb": "NB01 §5"}, {"id": "red", "label": "Red en capas", "x": 230, "y": 310, "kind": "core", "key": null, "say": "Cada neurona oculta traza su línea y la salida las combina: así nacen fronteras curvas.", "ex": "Dos neuronas vencen a XOR; las agencias de Riobamba, Latacunga y Ambato y el comité central.", "ask": "¿Cuántas neuronas ocultas necesitas, como mínimo, para XOR?", "trap": "Creer que más capas siempre es mejor.", "slide": "xor-resuelto", "nb": "NB02 E"}, {"id": "perdida", "label": "Pérdida", "x": 230, "y": 510, "kind": "core", "key": null, "say": "Un solo número que dice qué tan mal vamos; 0 es perfecto.", "ex": "Casas de Quito (MSE = 132.25) y el meteorólogo «seguro» (BCE).", "ask": "¿Por qué la BCE castiga tanto decir 1 % cuando el socio sí pagó?", "trap": "Usar MSE para clasificar sí/no.", "slide": "perdida", "nb": "NB01 §6"}, {"id": "gradiente", "label": "Descenso de gradiente", "x": 700, "y": 510, "kind": "key", "key": 4, "say": "Damos cada paso en contra de la pendiente: así la pérdida baja.", "ex": "Bajar el Cotopaxi con neblina, tanteando con el pie; y la ducha: si giras la llave de golpe te quemas.", "ask": "Si la pendiente de un peso es +4, ¿el peso sube o baja?", "trap": "Restar o sumar al revés: la pendiente apunta cuesta arriba.", "slide": "pendiente", "nb": "NB01 §7–8"}, {"id": "retro", "label": "Retropropagación", "x": 1170, "y": 510, "kind": "core", "key": null, "say": "Reparte la culpa del error hacia atrás, multiplicando efectos con la regla de la cadena.", "ex": "La barra de chocolate amarga y la cadena del cacao; los engranajes.", "ask": "Si una neurona ReLU está apagada, ¿qué culpa reciben sus pesos?", "trap": "Creer que hay que hacerla a mano: TensorFlow la calcula.", "slide": "culpa", "nb": "NB02 A–D"}, {"id": "entrenar", "label": "Entrenar bien", "x": 1170, "y": 710, "kind": "core", "key": null, "say": "ReLU en las ocultas, pesos al azar bien escalados, un learning rate sensato y lotes.", "ex": "La encuesta del INEC en vez del censo; la carrera de los optimizadores.", "ask": "¿Por qué no empezar con todos los pesos en cero?", "trap": "Subir el learning rate para «ir más rápido».", "slide": "carrera", "nb": "NB02 G"}, {"id": "keras", "label": "Keras en 3 pasos", "x": 700, "y": 710, "kind": "tool", "key": null, "say": "Tres pasos que hacen todo lo de la semana: capas Dense, compile y fit.", "ex": "TensorFlow es el motor y Keras el volante; las capas se apilan como LEGO; la red de las lunas: 337 parámetros y 95 % en el examen final.", "ask": "¿Qué hace fit() por dentro?", "trap": "Olvidar separar datos de validación.", "slide": "tf-keras", "nb": "NB02 F"}, {"id": "metricas", "label": "Métricas|más allá de la exactitud", "x": 230, "y": 710, "kind": "key", "key": 5, "say": "Cuando los casos que buscas son pocos, la exactitud engaña: mira recall, precisión y AUC.", "ex": "Una alarma de humo que nunca suena «acierta» casi siempre. 87 % de exactitud sin encontrar a ningún moroso.", "ask": "¿Qué es peor para la cooperativa: una falsa alarma o un moroso que no vimos?", "trap": "Celebrar un 95 % sin mirar cuántos casos positivos hay.", "slide": "trampa87", "nb": "—"}], "edges": [["ejemplos", "neurona", "su base es"], ["neurona", "activacion", "decide con"], ["activacion", "perceptron", "con escalón"], ["perceptron", "xor", "choca con"], ["xor", "red", "lo resuelve la"], ["red", "perdida", "se mide con"], ["perdida", "gradiente", "se baja con"], ["gradiente", "retro", "la pendiente sale de"], ["retro", "entrenar", "y para"], ["entrenar", "keras", "en código"], ["keras", "metricas", "se juzga con"]], "tab": "La semana"}, {"id": "b01", "short": "01", "title": "01 · IA, machine learning y deep learning", "sub": "Qué significa que una máquina aprenda de ejemplos.", "nodes": [{"id": "ia", "label": "Inteligencia artificial", "x": 220, "y": 160, "kind": "core", "key": null, "say": "Sistemas que hacen tareas que parecen inteligentes, aprendan o no.", "ex": "El GPS que calcula la ruta; el rival de un videojuego.", "ask": "¿La calculadora del celular es IA?", "trap": "Usar «IA» como sinónimo de ChatGPT.", "slide": "circulos", "nb": ""}, {"id": "ml", "label": "Machine learning", "x": 620, "y": 160, "kind": "core", "key": null, "say": "La parte de la IA que aprende las reglas a partir de datos.", "ex": "Filtro de spam, recomendaciones de Netflix.", "ask": "¿Qué necesita un sistema de ML que un programa clásico no?", "trap": "Creer que aprende solo, sin ejemplos con respuesta.", "slide": "circulos", "nb": ""}, {"id": "dl", "label": "Deep learning", "x": 1020, "y": 160, "kind": "key", "key": null, "say": "Machine learning con redes neuronales de muchas capas.", "ex": "Desbloqueo facial, subtítulos automáticos, ChatGPT.", "ask": "¿Por qué se llama «profundo»?", "trap": "Pensar que siempre es la mejor opción para datos de tabla.", "slide": "usos", "nb": ""}, {"id": "reglas", "label": "Reglas escritas a mano", "x": 220, "y": 470, "kind": "trap", "key": null, "say": "Funcionan cuando sabemos escribirlas, y fallan cuando el mundo cambia.", "ex": "«Si dice GRATIS, es spam» manda a spam el «¡Envío gratis!» de tu tienda.", "ask": "Escribe una regla para reconocer un gato. ¿Cuál es su contraejemplo?", "trap": "—", "slide": "gato", "nb": ""}, {"id": "ejemplos", "label": "Ejemplos con su respuesta", "x": 620, "y": 470, "kind": "ex", "key": null, "say": "Datos + respuestas → el modelo encuentra las reglas.", "ex": "10 000 correos marcados como spam o no spam.", "ask": "¿De dónde sacarías los ejemplos en tu trabajo?", "trap": "Olvidar que la calidad de las respuestas limita al modelo.", "slide": "reglas", "nb": ""}, {"id": "ingredientes", "label": "Datos + cómputo + algoritmos", "x": 1020, "y": 470, "kind": "trend", "key": null, "say": "Las ideas son de 1958; despegaron cuando se juntaron muchos datos, GPU y mejores algoritmos.", "ex": "AlexNet (2012), el Transformer (2017), ChatGPT (2022).", "ask": "Si el cómputo crece más de 3× por año, ¿importan todavía los algoritmos? (lectura)", "trap": "—", "slide": "ahora", "nb": ""}], "edges": [["ia", "ml", "contiene a"], ["ml", "dl", "contiene a"], ["ia", "reglas", "puede usar"], ["ml", "ejemplos", "aprende de"], ["dl", "ingredientes", "despegó por"], ["reglas", "ejemplos", "frente a"]], "tab": "IA, ML y DL"}, {"id": "b02", "short": "02", "title": "02 · La neurona artificial", "sub": "Una calculadora con opinión.", "nodes": [{"id": "x", "label": "Datos x", "x": 150, "y": 140, "kind": "core", "key": null, "say": "Lo que sabemos del caso, ya escalado (0 = el promedio).", "ex": "Ingreso 0.8, antigüedad 0.5, atrasos −1.0.", "ask": "¿Qué significa un dato de −1.0?", "trap": "Usar datos sin escalar.", "slide": "comite", "nb": "NB01 §1"}, {"id": "w", "label": "Pesos w", "x": 150, "y": 400, "kind": "core", "key": null, "say": "Cuánto confía la neurona en cada dato; un peso negativo resta.", "ex": "Atrasos con peso −2.0: más atrasos, menos puntaje.", "ask": "¿Qué pasa si un peso vale 0?", "trap": "Olvidar que negativo × negativo suma.", "slide": "comite", "nb": ""}, {"id": "b", "label": "Sesgo b", "x": 150, "y": 650, "kind": "core", "key": null, "say": "La disposición general: qué tan exigente es el comité.", "ex": "b = −0.5: el comité empieza restando.", "ask": "¿Qué número cambia si el comité se vuelve más exigente?", "trap": "Olvidar sumarlo.", "slide": "comite", "nb": ""}, {"id": "z", "label": "Puntaje|z = w·x + b", "x": 560, "y": 400, "kind": "key", "key": 1, "say": "Multiplica, suma y añade el sesgo.", "ex": "Tu nota final del curso: cada nota por lo que pesa, menos la exigencia (Ana: 76 − 70 = +6). El comité: socio A, z = 2.81.", "ask": "¿El socio B (0.2, −0.5, 1.5) es aprobado?", "trap": "Confundir z (puntaje) con la probabilidad.", "slide": "nota", "nb": "NB01 §1"}, {"id": "linea", "label": "Una línea de decisión", "x": 560, "y": 140, "kind": "ex", "key": null, "say": "Donde z = 0 la neurona duda; de un lado aprueba, del otro rechaza.", "ex": "Mueve los pesos en la lámina: la línea gira; el sesgo la desplaza.", "ask": "¿Qué pasa con un socio justo sobre la línea?", "trap": "Creer que una neurona puede trazar curvas.", "slide": "linea", "nb": ""}, {"id": "act", "label": "Activación", "x": 900, "y": 400, "kind": "key", "key": 2, "say": "Escalón, sigmoide o ReLU deciden qué sale; sin ellas, apilar capas no sirve.", "ex": "Interruptor, regulador de luz, válvula.", "ask": "¿Para qué sirve la activación?", "trap": "Decir «solo para dar probabilidades».", "slide": "activacion", "nb": "NB01 §2"}, {"id": "prob", "label": "Probabilidad|0 a 1", "x": 1200, "y": 210, "kind": "core", "key": null, "say": "La sigmoide aplasta el puntaje entre 0 y 1.", "ex": "z = 2.81 → 94 %; z = 0 → 50 %.", "ask": "¿Qué da z = −2.81?", "trap": "Leer 0.94 como «94 % de acierto del modelo».", "slide": "sigmoide", "nb": ""}, {"id": "curvas", "label": "Curvas (dobleces)", "x": 1200, "y": 600, "kind": "core", "key": null, "say": "Cada ReLU aporta un doblez; con varios se arma cualquier curva.", "ex": "La curva de demanda de taxis con 2, 4 u 8 neuronas.", "ask": "¿Cuántas capas sin activación equivalen a una sola?", "trap": "—", "slide": "doblar", "nb": ""}], "edges": [["x", "z", "entran a"], ["w", "z", "ponderan"], ["b", "z", "se suma a"], ["z", "linea", "z = 0 es"], ["z", "act", "pasa por"], ["act", "prob", "la sigmoide da"], ["act", "curvas", "la ReLU permite"]], "tab": "La neurona"}, {"id": "b03", "short": "03", "title": "03 · Cómo aprende una neurona", "sub": "Equivocarse, corregir un poquito y repetir.", "nodes": [{"id": "pred", "label": "Predice", "x": 200, "y": 160, "kind": "core", "key": null, "say": "Calcula z y decide con su activación.", "ex": "El socio de la lámina 21 obtiene z = −0.30: rechaza.", "ask": "—", "trap": "—", "slide": "ciclo", "nb": ""}, {"id": "comp", "label": "Compara", "x": 560, "y": 160, "kind": "core", "key": null, "say": "Mira la respuesta correcta y y nota si se equivocó.", "ex": "El socio sí pagó (y = +1).", "ask": "¿Qué hace si acierta?", "trap": "—", "slide": "ciclo", "nb": ""}, {"id": "regla", "label": "Regla|w ← w + η·y·x", "x": 920, "y": 160, "kind": "key", "key": null, "say": "Si debía decir sí, suma el dato; si debía decir no, lo resta.", "ex": "w = (0.2, −0.5) → (1.2, 0.5); z pasa a +2.70.", "ask": "¿Y si el socio NO hubiera pagado y la neurona dijo sí?", "trap": "Corregir también cuando acierta.", "slide": "correccion", "nb": "NB01 §3"}, {"id": "epoca", "label": "Época", "x": 1240, "y": 400, "kind": "core", "key": null, "say": "Una vuelta completa por todos los ejemplos.", "ex": "Vuelta 1: 5 errores; vuelta 3: 0.", "ask": "¿Cuántas épocas necesitó en la demo?", "trap": "—", "slide": "entrenar", "nb": "NB01 §4"}, {"id": "conv", "label": "Si hay una línea, la encuentra", "x": 940, "y": 640, "kind": "ex", "key": null, "say": "Garantía de Rosenblatt (1958) y Novikoff (1962) para datos separables.", "ex": "La línea se pone verde: 0 errores.", "ask": "¿Qué pasa si no existe esa línea?", "trap": "—", "slide": "entrenar", "nb": ""}, {"id": "xor3", "label": "XOR: el límite", "x": 520, "y": 640, "kind": "key", "key": 3, "say": "Ninguna recta separa la luz de la escalera: el perceptrón nunca baja de los errores.", "ex": "Minsky y Papert (1969) y el primer invierno de la IA.", "ask": "¿Dónde aparece algo así en un negocio? (interacciones)", "trap": "Pensar que más épocas lo arreglan.", "slide": "xor", "nb": "NB01 §5"}, {"id": "locro", "label": "Sazonar un locro", "x": 200, "y": 520, "kind": "ex", "key": null, "say": "Pruebas, le falta sal, una pizca, vuelves a probar.", "ex": "Medio salero = un η demasiado grande.", "a
